<title id="title">Naqla Business Model Canvas</title>
<desc id="desc">Nine-section proposed business model for a moving-services marketplace. Assumptions require validation.</desc>
<rect width="1600" height="1060" fill="#EEF4F0"/>
<style>text{font-family:Arial,sans-serif;fill:#102B36}.heading{font-size:23px;font-weight:700}.body{font-size:19px}.meta{font-size:17px}</style>
<text x="32" y="54" font-size="36" font-weight="700">Naqla | Business Model Canvas</text>
<text x="32" y="87" class="meta">Designed for: Naqla moving platform    •    Prepared on: Mazzen branch    •    Version 1    •    8 Nov 2026</text>
